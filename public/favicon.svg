<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="30%" stop-color="#FFE585"/>
      <stop offset="70%" stop-color="#F2A000"/>
      <stop offset="100%" stop-color="#B87300"/>
    </linearGradient>
    <linearGradient id="navy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152C5B"/>
      <stop offset="100%" stop-color="#081830"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Navy Rounded Emblem Base -->
  <rect width="64" height="64" rx="16" fill="url(#navy-bg)"/>
  
  <!-- Outer Gold Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="url(#gold-metal)" stroke-width="2"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" fill="none" stroke="#FFE8AB" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Velocity Chess Academy Crown & Knight Icon -->
  <g filter="url(#shadow)">
    <!-- Crown Coronet atop Knight -->
    <path d="M 22 13 L 26 20 L 32 14 L 38 20 L 42 13 L 40 22 L 24 22 Z" fill="url(#gold-metal)"/>
    <circle cx="22" cy="12" r="1.5" fill="#FFE8AB"/>
    <circle cx="32" cy="13" r="1.5" fill="#FFE8AB"/>
    <circle cx="42" cy="12" r="1.5" fill="#FFE8AB"/>

    <!-- Chess Knight Profile -->
    <path d="M 37 23 
             C 32 23, 26 27, 22 34 
             C 19 39, 18 42, 23 42 
             C 27 42, 29 38, 32 38 
             C 35 38, 36 41, 33 46 
             C 27 49, 22 54, 19 56 
             L 45 56 
             C 45 47, 44 38, 41 31 
             C 40 26, 39 23, 37 23 Z" 
          fill="url(#gold-metal)"/>

    <!-- Eye & Details -->
    <circle cx="29" cy="31" r="1.5" fill="#081830"/>
    <circle cx="28.6" cy="30.6" r="0.6" fill="#FFFDF0"/>

    <!-- Mane Ridges -->
    <path d="M 39 28 L 44 33" stroke="#FFE585" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 40 35 L 45 40" stroke="#FFE585" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 41 42 L 45 47" stroke="#FFE585" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pedestal Base Plate -->
    <path d="M 16 55 L 48 55 L 47 58 L 17 58 Z" fill="url(#gold-metal)"/>
  </g>
</svg>