<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Velocity Chess Academy Brand Favicon -->
  <!-- Background: Bright Yellow (#F5E913 / #FFEB00) -->
  <rect width="64" height="64" rx="14" fill="#F5E913"/>
  <!-- Subtle border to define emblem edges -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#DC3627" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Red Knight Emblem Artwork (#DC3627 / #E7472F) -->
  <image href="data:image/png;base64," x="0" y="0" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
